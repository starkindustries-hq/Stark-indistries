<style>
/* Layout: one-screen app — header, reactor + status, scrolling conversation, command bar pinned to the bottom. */
:root{
  --bg:#05080e; --panel:#0c1424; --panel2:#111c31; --line:#1c2b46;
  --fg:#e7f2ff; --muted:#8ea3c1; --accent:#ffb648; --accent2:#3de0ff;
  --danger:#ff5468; --ok:#3ddc97; --ink-on-accent:#03121a;
  --display:"Rajdhani","Hind",system-ui,sans-serif;
  --body:"Hind","Noto Sans Devanagari",system-ui,-apple-system,sans-serif;
  --scale:1;
  --grid:color-mix(in srgb,var(--accent) 7%,transparent);
  color-scheme:dark;
  font-size:calc(16px * var(--scale));
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:1rem;line-height:1.45;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto;position:relative}
.top{display:flex;align-items:center;gap:.5rem;padding:.6rem max(12px,env(safe-area-inset-right,0px)) .4rem max(12px,env(safe-area-inset-left,0px))}
.brand{flex:1;min-width:0;text-align:center;font-family:var(--display);font-weight:700;font-size:clamp(1.05rem,5.5vw,1.45rem);letter-spacing:0;color:var(--accent);line-height:1;white-space:nowrap;overflow:hidden;animation:fadeDown .7s .1s both;text-shadow:0 0 18px color-mix(in srgb,var(--accent) 45%,transparent)}
.brand small{display:block;font-size:.62rem;letter-spacing:.18em;overflow:hidden;text-shadow:none;color:var(--muted);font-weight:600;margin-top:.2rem}
:lang(hi) .brand small{letter-spacing:.02em;font-size:.72rem}
.icon-btn{width:2.75rem;height:2.75rem;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:1.3rem;height:1.3rem;stroke:var(--fg);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.banner{margin:.2rem max(12px,env(safe-area-inset-right,0px)) .2rem max(12px,env(safe-area-inset-left,0px));padding:.7rem .8rem;border-radius:14px;border:1px solid color-mix(in srgb,var(--danger) 55%,transparent);background:color-mix(in srgb,var(--danger) 12%,var(--bg));display:flex;gap:.7rem;align-items:center;font-size:.92rem}
.banner p{margin:0;flex:1;min-width:0}
.banner button{flex:none}
.stage{display:flex;flex-direction:column;align-items:center;padding:.2rem 16px 0}
#orb{width:min(62vw,34vh,300px);height:min(62vw,34vh,300px);touch-action:manipulation;cursor:pointer;border-radius:50%}
.status{min-height:2.9em;max-width:34rem;text-align:center;font-family:var(--display);font-weight:600;font-size:1.25rem;color:var(--accent);padding:.2rem 0 .3rem;overflow-wrap:anywhere}
.status.heard{color:var(--fg);font-family:var(--body);font-weight:500;font-size:1.1rem}
.chat{flex:1;min-height:0;overflow-y:auto;padding:.4rem max(14px,env(safe-area-inset-right,0px)) .6rem max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:.5rem;-webkit-overflow-scrolling:touch}
.empty{color:var(--muted);text-align:center;margin:auto;max-width:28rem;padding:1rem;white-space:pre-line}
.msg{max-width:86%;padding:.6rem .85rem;border-radius:16px;font-size:1rem;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:color-mix(in srgb,var(--accent) 16%,var(--bg));border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-bottom-right-radius:5px}
.msg.j{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:5px}
.card{position:relative;overflow:hidden;animation:rise .32s cubic-bezier(.2,.8,.2,1) both;align-self:stretch;background:var(--panel2);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:16px;padding:.8rem;display:flex;flex-direction:column;gap:.6rem}
.card .ttl{font-weight:600}
.card .sub{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.card .row{display:flex;flex-wrap:wrap;gap:.5rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:3rem;padding:.55rem 1.1rem;border-radius:14px;border:0;background:var(--accent);color:var(--ink-on-accent);font-weight:700;font-size:1.02rem;text-decoration:none;cursor:pointer;touch-action:manipulation}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 60%,transparent)}
.btn.danger{background:var(--danger);color:#fff}
.btn.ok{background:var(--ok);color:#04150d}
.btn[disabled]{opacity:.5}
.btn.small{min-height:2.4rem;padding:.35rem .8rem;font-size:.92rem}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.35rem max(12px,env(safe-area-inset-right,0px)) .45rem max(12px,env(safe-area-inset-left,0px));scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:.45rem .85rem;font-size:.92rem;cursor:pointer;white-space:nowrap}
.chip.sos{border-color:color-mix(in srgb,var(--danger) 60%,transparent);color:var(--danger)}
.bar{border-top:1px solid var(--line);background:var(--panel);padding:.55rem max(12px,env(safe-area-inset-right,0px)) .6rem max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:.5rem}
.inrow{display:flex;gap:.5rem}
.inrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:.75rem .9rem;font-size:1rem}
.mic{position:relative;width:3.1rem;height:3.1rem;border-radius:50%;border:0;background:var(--accent);display:grid;place-items:center;cursor:pointer;flex:none}
.mic svg{width:1.4rem;height:1.4rem;stroke:var(--ink-on-accent);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.mic.on{background:var(--danger)}
.mic.on svg{stroke:#fff}
.hf{display:flex;align-items:center;gap:.7rem}
.hf .txt{flex:1;min-width:0}
.hf b{display:block;font-weight:600}
.hf span{display:block;color:var(--muted);font-size:.82rem}
.switch{position:relative;width:3.3rem;height:1.9rem;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .2s}
.switch i::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.switch input:checked+i{background:color-mix(in srgb,var(--accent) 40%,var(--bg))}
.switch input:checked+i::after{transform:translateX(1.4rem);background:var(--accent)}
.switch input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
/* full-screen sheets */
.sheet{animation:sheetIn .28s cubic-bezier(.2,.8,.2,1) both;position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{display:flex;align-items:center;gap:.6rem;padding:.6rem max(12px,env(safe-area-inset-right,0px)) .6rem max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-head h2{flex:1;margin:0;font-family:var(--display);font-size:1.4rem;letter-spacing:.02em}
.sheet-body{flex:1;overflow-y:auto;padding:1rem max(16px,env(safe-area-inset-right,0px)) 2rem max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:.8rem;-webkit-overflow-scrolling:touch}
.sheet-body>*{max-width:40rem;width:100%;margin-inline:auto}
.sec{font-family:var(--display);font-weight:700;color:var(--accent);letter-spacing:.08em;text-transform:uppercase;font-size:.95rem;margin-top:.8rem}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:.9rem;display:flex;flex-direction:column;gap:.7rem}
.box p{margin:0}
.muted{color:var(--muted)}
.field{display:flex;flex-direction:column;gap:.3rem}
.field label{font-size:.88rem;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:.75rem .85rem;font-size:1rem;width:100%;min-width:0}
.field input[type=range]{padding:0;background:transparent;border:0;accent-color:var(--accent);height:2rem}
.line{display:flex;align-items:center;gap:.7rem}
.line .grow{flex:1;min-width:0}
.list{display:flex;flex-direction:column;gap:.5rem}
.item{display:flex;align-items:center;gap:.6rem;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:.6rem .7rem}
.item .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.item .grow small{display:block;color:var(--muted)}
.x{width:2.4rem;height:2.4rem;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--muted);font-size:1.2rem;flex:none}
.ex{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.65rem .8rem;cursor:pointer}
.steps{display:flex;gap:.3rem;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.steps i{flex:1;height:5px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--accent)}
.setup-step h3{font-family:var(--display);font-size:1.7rem;margin:.2rem 0;text-wrap:balance}
.setup-step .lead{color:var(--muted);margin:0 0 .4rem}
.choice{display:flex;flex-wrap:wrap;gap:.45rem}
.choice button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:.5rem 1rem;cursor:pointer;font-size:1rem}
.choice button.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--bg))}
.foot{display:flex;gap:.6rem;padding:.7rem max(16px,env(safe-area-inset-right,0px)) .8rem max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
.foot .btn{flex:1}
.pill{display:inline-block;padding:.15rem .6rem;border-radius:999px;font-size:.8rem;font-weight:600;border:1px solid}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.pill.bad{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 50%,transparent)}
.pill.wait{color:var(--muted);border-color:var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(6.5rem + env(safe-area-inset-bottom,0px));z-index:40;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:.6rem 1rem;max-width:calc(100% - 32px);box-shadow:0 8px 30px #0008}
/* ---- motion: transform/opacity only, so the phone's graphics chip does the work */
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.bg::before{content:"";position:absolute;inset:-48px 0 0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:44px 44px;
  -webkit-mask-image:radial-gradient(ellipse 80% 55% at 50% 28%,#000 10%,transparent 70%);mask-image:radial-gradient(ellipse 80% 55% at 50% 28%,#000 10%,transparent 70%);animation:gridDrift 9s linear infinite;will-change:transform}
.bg::after{content:"";position:absolute;left:50%;top:22%;width:120vmax;height:120vmax;margin:-60vmax 0 0 -60vmax;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 16%,transparent) 0,transparent 45%);animation:breathe 9s ease-in-out infinite alternate;will-change:transform,opacity}
.scan{position:absolute;left:0;right:0;top:0;height:120px;background:linear-gradient(transparent,color-mix(in srgb,var(--accent) 9%,transparent),transparent);animation:scan 7s linear infinite;will-change:transform}
@keyframes gridDrift{to{transform:translateY(44px)}}
@keyframes breathe{from{transform:scale(.85);opacity:.7}to{transform:scale(1.1);opacity:1}}
@keyframes scan{from{transform:translateY(-130px)}to{transform:translateY(100vh)}}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes riseR{from{opacity:0;transform:translateX(18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes sheetIn{from{opacity:.4;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes statusIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes ripple{from{transform:scale(1);opacity:.75}to{transform:scale(2);opacity:0}}
@keyframes dot{0%,80%,100%{transform:scale(.5);opacity:.35}40%{transform:scale(1);opacity:1}}
@keyframes shine{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
.msg.j{animation:rise .3s cubic-bezier(.2,.8,.2,1) both}
.msg.me{animation:riseR .26s cubic-bezier(.2,.8,.2,1) both}
.msg.instant{animation:none}
.card::after{content:"";position:absolute;top:0;bottom:0;left:0;width:35%;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--accent) 14%,transparent),transparent);transform:translateX(-120%);animation:shine 1.1s .25s ease-out 1;pointer-events:none}
.chip{animation:rise .45s cubic-bezier(.2,.8,.2,1) both;transition:transform .15s}
.chip:active,.btn:active,.icon-btn:active,.mic:active{transform:scale(.94)}
.btn,.icon-btn,.mic{transition:transform .15s,background-color .2s}
.status.swap{animation:statusIn .25s ease-out}
.mic.live::before,.mic.live::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);animation:ripple 1.6s ease-out infinite;pointer-events:none}
.mic.live::after{animation-delay:.8s}
.typing{align-self:flex-start;display:flex;gap:.35rem;padding:.8rem .95rem;background:var(--panel);border:1px solid var(--line);border-radius:16px;border-bottom-left-radius:5px;animation:rise .25s both}
.typing i{width:.5rem;height:.5rem;border-radius:50%;background:var(--accent2);animation:dot 1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.setup-step{animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
.banner{animation:fadeDown .3s both}
.toast{animation:statusIn .25s both}
.top .icon-btn{animation:fadeDown .6s both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
<style id="si-bar-css">
.si-bar{height:46px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:.45rem max(12px,env(safe-area-inset-right,0px)) .1rem max(12px,env(safe-area-inset-left,0px));font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:.8rem;flex:none}
.si-bar a{text-decoration:none;color:var(--muted,#8ea3c1)}
.si-back{display:inline-flex;align-items:center;gap:6px;padding:.35rem .7rem;border:1px solid rgba(255,255,255,.12);border-radius:999px;white-space:nowrap}
.si-back:hover{color:var(--fg,#e7f2ff)}
.si-lang{display:inline-flex;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:3px;gap:2px}
.si-lang a{padding:.28rem .75rem;border-radius:999px;font-weight:600;letter-spacing:.04em}
.si-lang a.on{background:var(--accent,#3de0ff);color:#04111a}
#setup{top:calc(env(safe-area-inset-top,0px) + 46px);padding-top:0}
</style>
</head>

      <label class="switch"><input type="checkbox" id="hf"><i></i></label>
    </div>
  </div>
</div>

</section>

<section class="sheet" id="sheet" hidden>

</section>

function findApp(name) {

const REL = {
  mom: ['mom', 'mummy', 'mum', 'mother', 'maa', 'mumma', 'मम्मी', 'माँ', 'मां'], dad: ['dad', 'papa', 'daddy', 'father', 'पापा', 'पिताजी'],
  wife: ['wife', 'biwi', 'पत्नी', 'बीवी'], husband: ['husband', 'पति'], brother: ['brother', 'bro', 'bhai', 'bhaiya', 'भाई', 'भैया'],
  sister: ['sister', 'sis', 'didi', 'दीदी', 'बहन'], son: ['son', 'beta', 'बेटा', 'बेटे'], daughter: ['daughter', 'beti', 'बेटी', 'बिटिया'],
  grandma: ['grandma', 'dadi', 'nani', 'दादी', 'नानी'], grandpa: ['grandpa', 'dada', 'nana', 'दादा', 'नाना'],
};
function relGroup(word) {
  const w = M.plain(word);
  for (const [g, words] of Object.entries(REL)) if (words.some((x) => M.plain(x) === w)) return g;
  return null;
}
function findContact(raw) {
  let name = String(raw || '').trim().replace(/^(my |to |मेरे |मेरी |मेरा )/, '').replace(/('s)? (number|phone|mobile)$/, '').trim();
  if (/^\+?[\d\s-]{6,}$/.test(name)) return { name, phone: name.replace(/[\s-]/g, '') };
  if (!contacts.length) return null;
  const g = relGroup(name);
  if (g) {
    const byRel = contacts.find((c) => c.rel && relGroup(c.rel) === g);
    if (byRel) return byRel;
    for (const alias of REL[g]) {
      const r = M.rank(alias, contacts, (c) => c.name, 0.85);
      if (r.length) return r[0][0];
    }
  }
  const r = M.rank(name, contacts, (c) => c.name + (c.rel ? ' ' + c.rel : ''), 0.7);
  return r.length ? r[0][0] : null;
}
function waNumber(raw) {
  let d = String(raw).replace(/\D/g, '');
  if (String(raw).trim().startsWith('+')) return d;
  if (d.startsWith('00')) d = d.slice(2);
  if (d.length === 11 && d.startsWith('0')) d = d.slice(1);
  if (d.length === 10) d = '91' + d;
  return d;
}
const smsHref = (num, body) => `sms:${num}${isIOS ? '&' : '?'}body=${encodeURIComponent(body)}`;

const Voice = {
  speaking: false, unlocked: false, list: [],
  load() { try { this.list = (window.speechSynthesis && speechSynthesis.getVoices()) || []; } catch (e) { this.list = []; } },
  candidates() {
    const pre = HI ? 'hi' : 'en';
    return this.list.filter((v) => v.lang && v.lang.toLowerCase().replace('_', '-').startsWith(pre));
  },
  choose() {
    const c = this.candidates();
    if (P.voice) { const v = c.find((x) => x.voiceURI === P.voice || x.name === P.voice); if (v) return v; }
    const score = (v) => {
      const l = v.lang.toLowerCase().replace('_', '-'), n = v.name.toLowerCase();
      let s = 0;
      if (l.endsWith('-in')) s += 10;
      if (/google/.test(n)) s += 4;
      if (/(rishi|lekha|neel|aditi|kiyara|heera|ravi|priya)/.test(n)) s += 3;
      if (v.localService) s += 1;
      return s;
    };
    return c.sort((a, b) => score(b) - score(a))[0] || null;
  },
  unlock() {
    if (this.unlocked || !window.speechSynthesis) return;
    this.unlocked = true;
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) { /* ignore */ }
  },
  chunks(text) {
    const parts = String(text).replace(/\s+/g, ' ').match(/[^.!?।]+[.!?।]*/g) || [text];
    const out = [];
    let cur = '';
    for (const p of parts) {
      if ((cur + p).length > 180 && cur) { out.push(cur.trim()); cur = ''; }
      cur += p;
    }
    if (cur.trim()) out.push(cur.trim());
    return out;
  },
  async speak(text) {
    const clean = String(text || '').replace(/[*_#`]/g, '').trim();
    if (!clean || !window.speechSynthesis) return;
    this.stop();
    this.speaking = true;
    const myRun = ++this.run;
    const voice = this.choose();
    for (const chunk of this.chunks(clean)) {
      if (myRun !== this.run) break;
      await new Promise((resolve) => {
        let done = false;
        const finish = () => { if (!done) { done = true; clearInterval(keep); clearTimeout(guard); resolve(); } };
        const u = new SpeechSynthesisUtterance(chunk);
        u.lang = voice ? voice.lang : SPEECH_LANG;
        if (voice) u.voice = voice;
        u.rate = P.rate; u.pitch = P.pitch;
        u.onend = finish; u.onerror = finish;
        u.onboundary = () => Orb.kick(0.4);
        u.onstart = () => Orb.kick(0.5);
        // Chrome stops long speech after ~15 s unless nudged.
        const keep = setInterval(() => { try { if (speechSynthesis.speaking && !isIOS) { speechSynthesis.pause(); speechSynthesis.resume(); } } catch (e) { /* ignore */ } }, 10000);
        const guard = setTimeout(finish, 4000 + chunk.length * 160 / Math.max(0.5, P.rate));
        try { speechSynthesis.speak(u); } catch (e) { finish(); }
      });
    }
    if (myRun === this.run) this.speaking = false;
  },
  run: 0,
  stop() { this.run++; this.speaking = false; try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) { /* ignore */ } },
};
if (window.speechSynthesis) {
  Voice.load();
  try { speechSynthesis.addEventListener('voiceschanged', () => Voice.load()); } catch (e) { speechSynthesis.onvoiceschanged = () => Voice.load(); }
}

const Ear = {
  rec: null, want: false, continuous: false, paused: false, on: false, restarts: [], heardAny: false,
  supported: !!SR,
  start(continuous) {
    if (!SR) return false;
    this.want = true; this.continuous = continuous; this.paused = false;
    this._begin();
    return true;
  },
  _begin() {
    if (!this.want || this.paused || this.on) return;
    let rec;
    try { rec = new SR(); } catch (e) { return; }
    this.rec = rec;
    rec.lang = SPEECH_LANG;
    rec.interimResults = true;
    rec.maxAlternatives = 1;
    rec.continuous = this.continuous && !isIOS;
    rec.onstart = () => { this.on = true; UI.listening(true); if (!this.continuous) Orb.pulse(); };
    rec.onspeechstart = () => Orb.kick(0.5);
    rec.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        const txt = (r[0] && r[0].transcript || '').trim();
        if (!txt) continue;
        if (r.isFinal) { this.heardAny = true; Jarvis.heard(txt); }
        else { interim += txt + ' '; Orb.kick(0.2); }
      }
      if (interim) UI.partial(interim.trim());
    };
    rec.onerror = (e) => {
      const err = e.error || '';
      if (err === 'not-allowed' || err === 'service-not-allowed') {
        this.want = false;
        if (this.continuous && this.heardAny) Jarvis.handsFreeStopped(); // Safari refused a restart, mic itself is fine
        else Jarvis.micProblem(err);
      } else if (err === 'network') {
        if (!this.continuous) UI.toast(T('sr_network'));
      } else if (err === 'language-not-supported') {
        this.want = false;
        UI.banner(T('sr_lang'));
      } else if (err === 'audio-capture') {
        this.want = false;
        Jarvis.micProblem(err);
      }
    };
    rec.onend = () => {
      this.on = false;
      this.rec = null;
      UI.listening(false);
      if (this.want && this.continuous && !this.paused) {
        const now = Date.now();
        this.restarts = this.restarts.filter((t) => now - t < 10000);
        this.restarts.push(now);
        if (this.restarts.length > 8) { // the browser keeps refusing to restart (iPhone Safari)
          this.want = false;
          Jarvis.handsFreeStopped();
          return;
        }
        setTimeout(() => this._begin(), 250);
      } else if (!this.continuous) {
        this.want = false;
      }
    };
    try { rec.start(); } catch (e) { this.on = false; this.rec = null; if (this.continuous) setTimeout(() => this._begin(), 600); }
  },
  pause() { this.paused = true; this._abort(); },
  resume() { if (!this.want) return; this.paused = false; setTimeout(() => this._begin(), 200); },
  stop() { this.want = false; this.paused = false; this._abort(); },
  _abort() { const r = this.rec; if (r) { try { r.abort(); } catch (e) { /* ignore */ } } },
};

  },
  contents(userText) {
    const recent = history.slice(-10);

    for (const m of recent) {
      const role = m.role === 'user' ? 'user' : 'model';
      if (!m.text) continue;
      if (!out.length && role === 'model') continue;
      if (role === last) out[out.length - 1].parts.push({ text: m.text });
      else { out.push({ role, parts: [{ text: m.text }] }); last = role; }

  async call(model, body) {
    const ctrl = new AbortController();

    try {
      return await fetch(`${this.base}/models/${encodeURIComponent(model)}:generateContent`, {
        method: 'POST', signal: ctrl.signal,
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': P.key.trim() },

  },
  /** Sends a request, handling model fallback and errors. Returns {text} or {error, say}. */
  async run(build) {
    if (!this.hasKey) return { error: 'no_key', say: T('no_key') };
    const tried = new Set();
    let model = P.model || this.fallbacks[0];
    for (let attempt = 0; attempt < 6; attempt++) {
      tried.add(model);
      let res;
      try { res = await this.call(model, build(P.thinking)); }
      catch (e) { return e && e.name === 'AbortError' ? { error: 'timeout', say: T('brain_timeout') } : { error: 'offline', say: T('brain_offline') }; }

        try { data = await res.json(); } catch (e) { return { error: 'parse', say: T('brain_error') }; }

        if (!c || !c.content) return { error: 'blocked', say: T('brain_blocked') };
        const text = (c.content.parts || []).filter((p) => !p.thought && p.text).map((p) => p.text).join('');
        return { text };
      }
      let err = '';
      try { err = (await res.text()).toLowerCase(); } catch (e) { /* ignore */ }
      if (res.status === 400 && err.includes('thinking') && P.thinking) { P.thinking = false; saveP(); continue; }
      if ((res.status === 400 && (err.includes('api key not valid') || err.includes('api_key_invalid'))) || res.status === 401 || res.status === 403) return { error: 'bad_key', say: T('brain_bad_key') };
      if (res.status === 404 || (res.status === 400 && err.includes('model'))) {
        const next = this.fallbacks.find((m) => !tried.has(m));
        if (!next) return { error: 'no_model', say: T('brain_no_model') };

      }
      if (res.status === 429) {
        const next = [...this.fallbacks].reverse().find((m) => !tried.has(m));
        if (next && attempt < 2) { model = next; continue; }
        return { error: 'quota', say: T('brain_quota') };
      }
      if (res.status >= 500 && attempt === 0) { await sleepMs(800); continue; }

  parse(text) {

const Remind = {
  timer: null,
  add(at, label, kind) {
    const r = { id: Date.now() + '' + Math.floor(Math.random() * 1000), at, label: label || '', kind: kind || 'reminder', done: false };
    reminders.push(r);
    reminders = reminders.filter((x) => !x.done || Date.now() - x.at < 86400000).slice(-50);
    saveReminders();
    this.schedule();
    return r;
  },
  schedule() {
    clearTimeout(this.timer);
    const next = reminders.filter((r) => !r.done).sort((a, b) => a.at - b.at)[0];
    if (!next) return;
    const wait = Math.max(0, Math.min(next.at - Date.now(), 60000));
    this.timer = setTimeout(() => this.check(), wait);
  },
  check() {
    const now = Date.now();
    for (const r of reminders) {
      if (r.done || r.at > now) continue;
      r.done = true;
      if (now - r.at < 3600000) this.fire(r);
    }
    saveReminders();
    this.schedule();
  },
  fire(r) {
    const text = r.kind === 'timer' && !r.label ? T('timer_due', { d: r.dur || '' }) : T('reminder_due', { l: r.label || (HI ? 'समय हो गया' : "it's time") });
    try { navigator.vibrate && navigator.vibrate([400, 200, 400, 200, 400]); } catch (e) { /* ignore */ }
    try {

  ics(r) {
    const d = new Date(r.at);
    const fmt = (x) => x.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
    const end = new Date(r.at + 10 * 60000);
    const title = (r.label || (HI ? 'जार्विस याद' : 'Jarvis reminder')).replace(/[\r\n,;]/g, ' ');
    const body = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Stark Industries//Jarvis//EN', 'BEGIN:VEVENT',
      `UID:${r.id}@jarvis`, `DTSTAMP:${fmt(new Date())}`, `DTSTART:${fmt(d)}`, `DTEND:${fmt(end)}`, `SUMMARY:${title}`,
      'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${title}`, 'TRIGGER:PT0M', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
    return URL.createObjectURL(new Blob([body], { type: 'text/calendar' }));
  },
  gcal(r) {
    const fmt = (x) => x.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
    const title = r.label || (HI ? 'जार्विस याद' : 'Jarvis reminder');
    return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${fmt(new Date(r.at))}/${fmt(new Date(r.at + 600000))}`;
  },
  androidAlarm(r) {
    const d = new Date(r.at);
    const msg = encodeURIComponent(r.label || 'Jarvis');
    return `intent:#Intent;action=android.intent.action.SET_ALARM;i.android.intent.extra.alarm.HOUR=${d.getHours()};i.android.intent.extra.alarm.MINUTES=${d.getMinutes()};S.android.intent.extra.alarm.MESSAGE=${msg};end`;
  },
};

// ------------------------------------------------------------------ the assistant
const Jarvis = {
  state: 'idle', handsFree: false, awakeUntil: 0, pending: null, busy: false, lastReply: '', wakeLock: null,
  get awake() { return Date.now() < this.awakeUntil; },
  setState(s) { if (s !== this.state && (s === 'thinking' || s === 'speaking')) Orb.pulse(); this.state = s; UI.thinking(s === 'thinking'); UI.status(); },

  async say(text, record = true) {
    if (!text) return;
    if (record) { UI.msg(text, false); this.lastReply = this.lastReply ? this.lastReply + ' ' + text : text; }
    this.setState('speaking');
    const wasListening = Ear.want;
    if (wasListening) Ear.pause();
    await Voice.speak(text);
    if (this.state === 'speaking') this.setState('idle');
    if (wasListening && this.handsFree) Ear.resume();
  },

  greeting() {
    const h = new Date().getHours();
    return T(h < 12 ? 'greet_morning' : h < 17 ? 'greet_afternoon' : 'greet_evening');
  },

  // Tap on the reactor or mic button
  tap() {
    Voice.unlock();
    if (this.state === 'speaking') { Voice.stop(); this.setState('idle'); if (this.handsFree) { this.awakeUntil = Date.now() + 25000; Ear.resume(); } return; }
    if (!SR) { UI.banner(isIOS && !/Safari/.test(UA) ? T('no_sr_ios_app') : T('no_sr')); $('text').focus(); return; }
    if (this.handsFree) { this.awakeUntil = Date.now() + 25000; UI.partial(T('listening')); if (!Ear.on) Ear.resume(); return; }
    if (Ear.on) { Ear.stop(); return; }
    UI.partial('');
    Ear.start(false);
  },

  async setHandsFree(on, announce = true) {
    Voice.unlock();
    if (on) {
      if (!SR) { UI.banner(T('no_sr')); $('hf').checked = false; return; }
      this.handsFree = true; P.handsFree = true; saveP();
      Ear.restarts = [];
      Ear.start(true);
      try { if (navigator.wakeLock) this.wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { /* not allowed here */ }
      if (announce) await this.say(T('hf_on'), false);
    } else {
      this.handsFree = false; P.handsFree = false; saveP();
      this.awakeUntil = 0;
      Ear.stop();
      try { this.wakeLock && this.wakeLock.release(); } catch (e) { /* ignore */ }
      this.wakeLock = null;
      if (announce) await this.say(T('hf_off'), false);
    }
    $('hf').checked = this.handsFree;
    UI.status();
  },

  handsFreeStopped() {
    this.handsFree = false; P.handsFree = false; saveP();
    $('hf').checked = false;
    UI.toast(T('hf_ios_stop'));
    UI.status();
  },

  micProblem(err) {
    if (this.handsFree) { this.handsFree = false; P.handsFree = false; saveP(); $('hf').checked = false; }
    if (!window.isSecureContext) { UI.banner(T('need_https')); return; }
    UI.banner(err === 'audio-capture' ? T('mic_denied') : T('mic_blocked'), T('reload'), () => location.reload());
    this.setState('idle');
  },

  heard(text) {
    UI.partial('');
    let t = String(text || '').trim();
    if (!t) return;
    const free = !this.handsFree || this.awake || this.pending;
    if (!free && !M.hasWake(t)) return;
    if (M.hasWake(t)) {
      const rest = M.afterWake(t);
      if (!rest) { this.wake(); return; }
      t = rest;
    }
    this.handle(t);
  },

  async wake() {
    this.awakeUntil = Date.now() + 25000;
    Orb.pulse();
    await this.say(pick('wake_replies'), false);
    this.awakeUntil = Date.now() + 25000;
    if (!this.handsFree && SR && !isIOS) Ear.start(false);
  },

  async handle(text) {
    const t = String(text || '').trim();
    if (!t) return;
    if (this.busy) { const a = parseCommand(t); if (a && a.type === 'stop') Voice.stop(); return; }
    this.busy = true; this.lastReply = '';
    UI.msg(t, true);
    try {
      if (this.pending) await this.resolvePending(t);
      else {
        const a = parseCommand(t);
        if (a) await this.exec(a, false);
        else await this.ask(t);
      }
    } catch (e) {
      console.error(e);
      await this.say(T('something_wrong'));
    } finally {
      history.push({ role: 'user', text: t });
      if (this.lastReply) history.push({ role: 'model', text: this.lastReply });
      saveHistory();
      this.busy = false;
      if (this.state !== 'speaking') this.setState('idle');
      if (this.handsFree) this.awakeUntil = Date.now() + 25000;
      else if (SR && !isIOS && (this.pending || /[?？]\s*$/.test(this.lastReply))) Ear.start(false);
    }
  },

  async ask(text) {
    if (!Brain.hasKey) { await this.say(T('no_key')); UI.addCard({ title: T('s3_title'), buttons: [{ label: T('settings'), onClick: () => Sheets.settings() }] }); return; }
    this.setState('thinking');
    const r = await Brain.ask(text);
    addFacts(r.remember);
    if (r.web && !r.error) {
      if (r.say) await this.say(r.say, false);
      this.setState('thinking');
      const w = await Brain.askWeb(text);
      await this.say(w.say || T('brain_error'));
    } else if (r.say) {
      await this.say(r.say);
    }
    for (const a of r.actions) await this.exec(a, true);
    if (!r.say && !r.actions.length && !r.web) await this.say(T('brain_error'));
  },

  yes(t) { return HI ? /^(हाँ|हां|हा|जी|जी हाँ|जी हां|हाँ जी|ठीक है|कर दो|करो|बिल्कुल|ओके|यस|yes|ok|okay)/.test(t) : /^(yes|yeah|yep|yup|sure|ok|okay|do it|go ahead|confirm|of course|please do|correct|absolutely)\b/.test(t); },
  no(t) { return HI ? /^(नहीं|नही|ना|मत|रहने दो|कैंसल|रुको|नो|no|cancel)/.test(t) : /^(no|nope|cancel|don't|do not|stop|wait|not now|never mind)\b/.test(t); },
  async resolvePending(t) {
    const p = this.pending; this.pending = null;
    const low = t.toLowerCase().trim();
    if (this.no(low)) { await this.say(T('cancelled')); return; }
    if (this.yes(low)) { await p(); return; }
    const a = parseCommand(t);
    if (a) await this.exec(a, false); else await this.ask(t);
  },

  async exec(a, quiet) {
    const ok = async (key, args) => { if (!quiet) await this.say(T(key, args)); };
    const s = (k) => String(a[k] == null ? '' : a[k]).trim();
    switch (a.type) {
      case 'wake': return this.wake();
      case 'stop': Voice.stop(); this.pending = null; return this.say(T('ok'), false);
      case 'sleep': this.awakeUntil = 0; return this.say(T('sleep'));
      case 'thanks': return this.say(pick('thanks_replies'));
      case 'greet': return this.say(this.greeting());
      case 'help': await this.say(T('help_spoken')); return;
      case 'set_address': P.address = s('value'); saveP(); return this.say(T('address_set'));
      case 'set_name': P.name = s('value'); saveP(); addFacts([T('fact_name', { n: s('value') })]); return this.say(T('name_set', { n: s('value') }));
      case 'rate': P.rate = Math.min(1.6, Math.max(0.6, P.rate + (a.change === 'faster' ? 0.12 : -0.12))); saveP(); return this.say(T(a.change === 'faster' ? 'rate_faster' : 'rate_slower'));
      case 'remember': addFacts([s('fact')]); return this.say(T('remembered'));
      case 'recall':
        if (!facts.length) return this.say(T('recall_none'));
        if (Brain.hasKey) return this.ask(T('recall_prompt'));
        return this.say(facts.slice(-8).join('. '));
      case 'forget_all':
        this.pending = async () => { facts = []; saveFacts(); history = []; saveHistory(); await this.say(T('forgot')); };
        return this.say(T('confirm_forget'));
      case 'time': { const d = new Date(); return this.say(T('time_now', { c: clockSpoken(d.getHours(), d.getMinutes()) })); }
      case 'date': return this.say(dateSpoken(new Date()));
      case 'battery': {
        try {
          if (!navigator.getBattery) return this.say(T('battery_na'));
          const b = await navigator.getBattery();
          return this.say(T(b.charging ? 'battery_charging' : 'battery', { n: String(Math.round(b.level * 100)) }));
        } catch (e) { return this.say(T('battery_na')); }
      }
      case 'unsupported': return this.say(T('web_cant', { x: T(a.what || 'x_screen') }));
      case 'torch': return this.say(T('web_cant', { x: T('x_torch') }));
      case 'volume': return this.say(T('web_cant', { x: T('x_volume') }));
      case 'brightness': return this.say(T('web_cant', { x: T('x_brightness') }));
      case 'youtube': {
        const q = s('query');
        const url = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);
        UI.addCard({ title: q, buttons: [{ label: T('b_youtube'), href: url, primary: true }] });
        UI.autoOpen(url);
        return ok('playing', { q });
      }
      case 'play_or_open': {
        const app = findApp(s('query'));
        if (app && M.score(s('query'), app.n) >= 0.88) return this.exec(A('open_app', { name: app.n }), quiet);
        return this.exec(A('youtube', { query: s('query') }), quiet);
      }
      case 'web_search': {
        const url = 'https://www.google.com/search?q=' + encodeURIComponent(s('query'));
        UI.addCard({ title: s('query'), buttons: [{ label: T('b_search'), href: url, primary: true }] });
        UI.autoOpen(url);
        return ok('searching', { q: s('query') });
      }
      case 'navigate': {
        const url = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(s('place'));
        UI.addCard({ title: s('place'), buttons: [{ label: T('b_maps'), href: url, primary: true }] });
        UI.autoOpen(url);
        return ok('navigating', { q: s('place') });
      }
      case 'camera':
        UI.addCard({ title: T('b_camera'), buttons: [{ label: T('b_camera'), onClick: () => UI.camera(), primary: true }] });
        return;
      case 'open_app': {
        const name = s('name');
        if (!name) return this.say(T('which_app'));
        const app = findApp(name);
        if (!app) return this.say(T('app_unknown', { n: name }));
        UI.addCard({ title: app.n, buttons: [{ label: T('b_open', { n: app.n }), href: app.u, primary: true }] });
        UI.autoOpen(app.u);
        return ok('open_tap', { n: app.n });
      }
      case 'call': {
        const who = s('name') || s('number');
        if (!who) return this.say(T('who_to_call'));
        const c = findContact(who);
        if (!c) { UI.addCard({ title: who, buttons: [{ label: T('contacts'), onClick: () => Sheets.contacts() }] }); return this.say(T('contact_unknown', { n: who })); }
        UI.addCard({ title: c.name, sub: c.phone, buttons: [{ label: T('b_call', { n: c.name }), href: 'tel:' + c.phone.replace(/[^\d+]/g, ''), ok: true }] });
        return ok('calling', { n: c.name });
      }
      case 'whatsapp':
      case 'sms':
      case 'message': {
        const who = s('name') || s('number');
        if (!who) return this.say(T('who_to_message'));
        if (!s('text')) return this.say(T('what_message'));
        const c = findContact(who);
        if (!c) { UI.addCard({ title: who, buttons: [{ label: T('contacts'), onClick: () => Sheets.contacts() }] }); return this.say(T('contact_unknown', { n: who })); }
        if (a.type === 'sms') {
          UI.addCard({ title: c.name, sub: s('text'), buttons: [{ label: T('b_sms'), href: smsHref(c.phone, s('text')), primary: true }] });
          return ok('sms_ready', { n: c.name });
        }
        const url = `https://wa.me/${waNumber(c.phone)}?text=${encodeURIComponent(s('text'))}`;
        UI.addCard({ title: c.name, sub: s('text'), buttons: [{ label: T('b_whatsapp'), href: url, primary: true }, { label: T('b_sms'), href: smsHref(c.phone, s('text')) }] });
        return ok('wa_ready', { n: c.name });
      }
      case 'reminder':
      case 'alarm': {
        let at = Number(a.at);
        if (!at && a.hour != null) {
          const d = new Date(); d.setHours(Number(a.hour) || 0, Number(a.minute) || 0, 0, 0);
          if (Number(a.day_offset) > 0) d.setDate(d.getDate() + Number(a.day_offset));
          if (d.getTime() <= Date.now()) d.setDate(d.getDate() + 1);
          at = d.getTime();
        }
        if (!at) return this.say(T('alarm_which_time'));
        const r = Remind.add(at, s('label'), 'reminder');
        const when = whenSpoken(new Date(at));
        const btns = [{ label: T('b_calendar'), href: isIOS ? Remind.ics(r) : Remind.gcal(r), download: isIOS ? 'jarvis-reminder.ics' : null, primary: true }];
        if (isAndroid && a.alarm) btns.unshift({ label: T('b_alarm'), href: Remind.androidAlarm(r), ok: true });
        UI.addCard({ title: when, sub: (r.label ? r.label + ' · ' : '') + T('reminder_open_note'), buttons: btns });
        if (quiet) return;
        return this.say(r.label ? T('reminder_set', { l: r.label, t: when }) : T('alarm_set', { t: when }));
      }
      case 'timer': {
        const sec = Math.round(Number(a.seconds) || 0);
        if (sec <= 0) return this.say(T('timer_how_long'));
        const r = Remind.add(Date.now() + sec * 1000, s('label'), 'timer');
        r.dur = durationSpoken(sec); saveReminders();
        UI.addCard({ title: durationSpoken(sec), sub: (r.label ? r.label + ' · ' : '') + T('reminder_open_note'), buttons: [] });
        return ok('timer_set', { d: durationSpoken(sec) });
      }
      case 'emergency': return this.emergency();
      default:
        if (!quiet) return this.say(T('brain_error'));
    }
  },

  async emergency() {
    if (!P.emNumber) {
      UI.addCard({ title: T('chip_sos'), danger: true, buttons: [{ label: T('b_call112'), href: 'tel:112', danger: true }] });
      return this.say(T('emergency_none'));
    }
    const name = P.emName || P.emNumber;
    const card = UI.addCard({ title: T('chip_sos') + ' · ' + name, sub: P.emNumber, danger: true, buttons: [
      { label: T('b_call', { n: name }), href: 'tel:' + P.emNumber.replace(/[^\d+]/g, ''), danger: true },
      { label: T('b_sms_loc'), href: smsHref(P.emNumber, T('emergency_sms_noloc')), danger: true, id: 'smsLoc' },
      { label: T('b_call112'), href: 'tel:112' },
    ] });
    this.say(T('emergency_start', { n: name }));
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition((pos) => {
        const link = `https://maps.google.com/?q=${pos.coords.latitude.toFixed(6)},${pos.coords.longitude.toFixed(6)}`;
        const a = card.querySelector('[data-id="smsLoc"]');
        if (a) a.href = smsHref(P.emNumber, T('emergency_sms', { l: link }));
      }, () => {}, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
    }
  },
};

// ------------------------------------------------------------------ UI
const UI = {
  partialText: '',
  status() {
    const el = $('status');
    if (this.partialText) { el.textContent = this.partialText; el.classList.add('heard'); $('mic').classList.toggle('live', Ear.on); return; }
    el.classList.remove('heard');
    const s = Jarvis.state;
    const txt = s === 'listening' ? T('listening') : s === 'thinking' ? T('thinking') : s === 'speaking' ? T('speaking')
      : Jarvis.handsFree ? (Jarvis.awake ? T('listening') : T('say_jarvis')) : T('tap_to_talk');
    if (txt !== el.textContent) { el.textContent = txt; el.classList.remove('swap'); void el.offsetWidth; el.classList.add('swap'); }
    $('mic').classList.toggle('on', Ear.on && !Jarvis.handsFree);
    $('mic').classList.toggle('live', Ear.on);
  },
  partial(t) { this.partialText = t; this.status(); },
  listening(on) {
    if (on && !Jarvis.handsFree) Jarvis.setState('listening');
    else if (!on && Jarvis.state === 'listening') Jarvis.setState('idle');
    if (!on && !Jarvis.handsFree) this.partialText = '';
    this.status();
  },
  chatEl() { return $('chat'); },
  scroll() { const c = this.chatEl(); requestAnimationFrame(() => { c.scrollTop = c.scrollHeight; }); },
  msg(text, mine, instant) {
    $('empty').hidden = true;
    const d = document.createElement('div');
    d.className = 'msg ' + (mine ? 'me' : 'j') + (instant ? ' instant' : '');
    const typing = $('typing');
    this.chatEl().insertBefore(d, typing && typing.parentNode === this.chatEl() ? typing : null);
    if (mine || instant || Orb.reduce) d.textContent = text;
    else this.typeOut(d, String(text));
    this.trim();
    this.scroll();
  },
  /** Reveals a reply word by word (finishes within about a second). */
  typeOut(d, text) {
    const parts = text.split(/(\s+)/);
    const per = Math.max(1, Math.ceil(parts.length / 50));
    let i = 0, n = 0;
    const step = () => {
      i = Math.min(parts.length, i + per);
      d.textContent = parts.slice(0, i).join('');
      if (++n % 6 === 0 || i >= parts.length) this.scroll();
      if (i < parts.length && d.isConnected) requestAnimationFrame(step);
    };
    d.textContent = '';
    requestAnimationFrame(step);
  },
  thinking(on) {
    let el = $('typing');
    if (on && !el) {
      el = document.createElement('div');
      el.id = 'typing'; el.className = 'typing'; el.setAttribute('aria-hidden', 'true');
      el.innerHTML = '<i></i><i></i><i></i>';
      this.chatEl().appendChild(el);
      this.scroll();
    } else if (!on && el) el.remove();
  },
  trim() { const c = this.chatEl(); while (c.children.length > 80) c.removeChild(c.children[1]); },
  addCard({ title, sub, buttons, danger }) {
    $('empty').hidden = true;
    const card = document.createElement('div');
    card.className = 'card';
    if (danger) card.style.borderColor = 'color-mix(in srgb,var(--danger) 60%,transparent)';
    card.innerHTML = `<div class="ttl">${esc(title || '')}</div>${sub ? `<div class="sub">${esc(sub)}</div>` : ''}<div class="row"></div>`;
    const row = card.querySelector('.row');
    for (const b of buttons || []) {
      let el;
      if (b.href) {
        el = document.createElement('a');
        el.href = b.href;
        if (/^https?:|^blob:/.test(b.href)) { el.target = '_blank'; el.rel = 'noopener'; }
        if (b.download) el.download = b.download;
      } else {
        el = document.createElement('button');
        el.type = 'button';
        el.addEventListener('click', b.onClick);
      }
      el.className = 'btn' + (b.danger ? ' danger' : b.ok ? ' ok' : b.primary ? '' : ' ghost');
      el.textContent = b.label;
      if (b.id) el.dataset.id = b.id;
      row.appendChild(el);
    }
    if (!row.children.length) row.remove();
    this.chatEl().appendChild(card);
    this.trim();
    this.scroll();
    return card;
  },
  /** Opens a link straight away when the browser allows it (only right after a tap). */
  autoOpen(url) {
    try {
      if (navigator.userActivation && navigator.userActivation.isActive) window.open(url, '_blank', 'noopener');
    } catch (e) { /* the card button is still there */ }
  },
  camera() {
    const i = document.createElement('input');
    i.type = 'file'; i.accept = 'image/*'; i.capture = 'environment';
    i.click();
  },
  banner(text, btnLabel, onBtn) {
    $('bannerText').textContent = text;
    const b = $('bannerBtn');
    if (btnLabel) { b.hidden = false; b.textContent = btnLabel; b.onclick = onBtn; } else b.hidden = true;
    $('banner').hidden = false;
  },
  toast(text) {
    const t = $('toast');
    t.textContent = text; t.hidden = false;
    clearTimeout(this._tt); this._tt = setTimeout(() => { t.hidden = true; }, 4500);
  },
  renderHistory() {
    const recent = history.slice(-24);
    for (const h of recent) this.msg(h.text, h.role === 'user', true);
    if (!recent.length) $('empty').hidden = false;
  },
};

// ------------------------------------------------------------------ arc reactor
const Orb = {
  ctx: null, c: null, w: 0, level: 0, kickV: 0, t0: performance.now(), raf: 0, bootAt: 0, waves: [], parts: [],
  quality: 2, slowTime: 0, lastNow: 0, lastDraw: 0, frame: 0, colors: null, glowCache: {}, reduce: false,
  init() {
    const c = $('orb');
    this.c = c;
    this.ctx = c.getContext('2d');
    this.reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    this.resize = () => {
      const r = c.getBoundingClientRect();
      const dpr = Math.min(this.quality >= 2 ? 2 : 1.25, window.devicePixelRatio || 1);
      c.width = Math.max(1, Math.round(r.width * dpr)); c.height = c.width;
      this.w = c.width; this.glowCache = {};
    };
    this.resize();
    window.addEventListener('resize', this.resize);
    this.makeParts();
    this.bootAt = performance.now();
    this.loop = (now) => { this.raf = requestAnimationFrame(this.loop); this.tick(now); };
    this.start();
    document.addEventListener('visibilitychange', () => (document.hidden ? this.stop() : this.start()));
  },
  start() { if (!this.raf && !document.hidden) { this.lastNow = 0; this.raf = requestAnimationFrame(this.loop); } },
  stop() { cancelAnimationFrame(this.raf); this.raf = 0; },
  makeParts() {
    const n = this.quality >= 2 ? 26 : 12;
    this.parts = Array.from({ length: n }, () => ({ a: Math.random() * Math.PI * 2, r: 0.6 + Math.random() * 0.28, s: (0.25 + Math.random() * 0.5) * (Math.random() < 0.5 ? -1 : 1), z: Math.random() }));
  },
  /** React to a word or a sound. */
  kick(v) { this.kickV = Math.min(1, this.kickV + (v || 0.35)); },
  /** Expanding shock-wave ring. */
  pulse() { if (this.waves.length < 4) this.waves.push(performance.now()); },
  glow(color) {
    const key = color + this.w;
    if (!this.glowCache[key]) {
      const g = document.createElement('canvas'); g.width = g.height = this.w;
      const x = g.getContext('2d'), c = this.w / 2;
      const rg = x.createRadialGradient(c, c, 0, c, c, c);
      rg.addColorStop(0, hexA(color, 0.55)); rg.addColorStop(0.42, hexA(color, 0.1)); rg.addColorStop(1, 'rgba(0,0,0,0)');
      x.fillStyle = rg; x.fillRect(0, 0, this.w, this.w);
      this.glowCache[key] = g;
    }
    return this.glowCache[key];
  },
  tick(now) {
    if (!$('sheet').hidden || !$('setup').hidden) return; // covered by a page: save battery
    const dt = this.lastNow ? now - this.lastNow : 16;
    this.lastNow = now;
    // Slow phone? Drop to a lighter reactor instead of stuttering.
    if (this.quality >= 2) {
      if (dt > 28 && dt < 250) this.slowTime += dt; else this.slowTime = Math.max(0, this.slowTime - dt);
      if (this.slowTime > 1500) { this.quality = 1; this.resize(); this.makeParts(); }
    }
    this.frame++;
    const busy = Jarvis.state !== 'idle' || this.waves.length || now - this.bootAt < 1700 || (Jarvis.handsFree && Jarvis.awake) || this.kickV > 0.02;
    if (!busy && this.frame % 2) return; // idle: 30 fps is plenty
    const ds = this.lastDraw ? Math.min(0.06, (now - this.lastDraw) / 1000) : 0.016;
    this.lastDraw = now;
    this.draw((now - this.t0) / 1000, now, ds);
  },
  draw(t, now, ds) {
    const ctx = this.ctx, W = this.w;
    if (!ctx || !W) return;
    if (!this.colors) {
      const css = getComputedStyle(document.documentElement);
      this.colors = { a: css.getPropertyValue('--accent').trim() || '#3de0ff', b: css.getPropertyValue('--accent2').trim() || '#ffb648' };
    }
    const s = Jarvis.state, think = s === 'thinking', reduce = this.reduce;
    const accent = think ? this.colors.b : this.colors.a;
    const boot = reduce ? 1 : Math.min(1, (now - this.bootAt) / 1400);
    const e = 1 - Math.pow(1 - boot, 3);
    const awakeHF = Jarvis.handsFree && Jarvis.awake;
    const live = s === 'listening' || s === 'speaking' || awakeHF;
    const speed = reduce ? 0 : think ? 2.4 : s === 'idle' && !awakeHF ? 0.35 : 0.9;
    this.kickV *= Math.pow(0.04, ds); // fades in about a second
    const base = s === 'listening' || awakeHF ? 0.2 : s === 'speaking' ? 0.18 : think ? 0.15 : 0.06 + 0.03 * Math.sin(t * 1.5);
    const target = base + this.kickV * 0.55 + (s === 'speaking' ? 0.06 * Math.abs(Math.sin(t * 9)) : 0);
    this.level += (target - this.level) * Math.min(1, ds * 12);
    const L = reduce ? 0.1 : this.level;
    const c = W / 2, r = (W / 2) * 0.98, rot = t * speed, TAU = Math.PI * 2;

    ctx.clearRect(0, 0, W, W);
    ctx.globalAlpha = Math.min(1, (0.55 + L * 1.3) * e);
    ctx.drawImage(this.glow(accent), 0, 0);
    ctx.globalAlpha = 1;

    // outer instrument ticks, drawing on during boot
    ctx.lineCap = 'butt';
    ctx.strokeStyle = hexA(accent, 0.45); ctx.lineWidth = Math.max(1, r * 0.006);
    ctx.beginPath();
    const ticks = 72, R1 = r * 0.985;
    for (let i = 0; i < Math.floor(ticks * e); i++) {
      const a = -rot * 0.12 + (i * TAU) / ticks, len = i % 6 === 0 ? r * 0.055 : r * 0.022;
      ctx.moveTo(c + Math.cos(a) * R1, c + Math.sin(a) * R1);
      ctx.lineTo(c + Math.cos(a) * (R1 - len), c + Math.sin(a) * (R1 - len));
    }
    ctx.stroke();

    // radar sweep with a fading tail
    if (!reduce && (this.quality >= 2 || think)) {
      const sw = rot * 1.4 - Math.PI / 2;
      ctx.lineWidth = r * 0.055;
      for (let k = 0; k < 6; k++) {
        ctx.strokeStyle = hexA(accent, (0.24 - k * 0.038) * e);
        ctx.beginPath(); ctx.arc(c, c, r * 0.895, sw - (k + 1) * 0.1, sw - k * 0.1); ctx.stroke();
      }
    }

    ctx.lineCap = 'round';
    const ring = (rad, width, n, frac, alpha, rr) => {
      ctx.strokeStyle = hexA(accent, alpha); ctx.lineWidth = width;
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        const a0 = rr + (i * TAU) / n;
        ctx.moveTo(c + Math.cos(a0) * rad, c + Math.sin(a0) * rad);
        ctx.arc(c, c, rad, a0, a0 + (TAU / n) * frac);
      }
      ctx.stroke();
    };
    ring(r * 0.82 * (0.85 + 0.15 * e), r * 0.032, 12, 0.62 * e, 0.92, rot * 0.5);
    ctx.strokeStyle = hexA(accent, 0.25); ctx.lineWidth = Math.max(1, r * 0.007);
    ctx.beginPath(); ctx.arc(c, c, r * 0.92, 0, TAU * e); ctx.stroke();
    ring(r * 0.69, r * 0.017, 36, 0.45 * e, 0.55, -rot * 0.8);
    ring(r * (0.52 + L * 0.12), r * 0.048, 10, 0.7 * e, 0.95, rot * 0.3);

    // orbiting particles
    ctx.fillStyle = hexA(accent, 0.85 * e);
    ctx.beginPath();
    const ps = (reduce ? 0 : 1) * (0.25 + speed * (think ? 1.4 : 1) + L * 1.5);
    for (const p of this.parts) {
      p.a += p.s * ps * ds;
      const rr = r * (p.r + L * 0.1 * p.z) * e, x = c + Math.cos(p.a) * rr, y = c + Math.sin(p.a) * rr, sz = r * (0.006 + p.z * 0.011);
      ctx.moveTo(x + sz, y); ctx.arc(x, y, sz, 0, TAU);
    }
    ctx.fill();

    // voice bars
    if (live) {
      ctx.strokeStyle = hexA(accent, 0.85); ctx.lineWidth = r * 0.018;
      ctx.beginPath();
      const n = this.quality >= 2 ? 56 : 36;
      for (let i = 0; i < n; i++) {
        const a = (i * TAU) / n, wave = L * (0.45 + 0.55 * Math.sin(a * 4 + t * 8) * Math.sin(a * 3 - t * 5));
        const inner = r * 0.36, outer = inner + r * (0.03 + Math.max(0, wave) * 0.2);
        ctx.moveTo(c + Math.cos(a) * inner, c + Math.sin(a) * inner);
        ctx.lineTo(c + Math.cos(a) * outer, c + Math.sin(a) * outer);
      }
      ctx.stroke();
    }

    // shock waves
    this.waves = this.waves.filter((w0) => now - w0 < 900);
    for (const w0 of this.waves) {
      const p = (now - w0) / 900;
      ctx.strokeStyle = hexA(accent, 0.65 * (1 - p)); ctx.lineWidth = r * 0.025 * (1 - p) + 1;
      ctx.beginPath(); ctx.arc(c, c, r * (0.3 + p * 0.68), 0, TAU); ctx.stroke();
    }

    // core
    const coreR = r * (0.26 + L * 0.2) * (0.4 + 0.6 * e);
    const cg = ctx.createRadialGradient(c, c, 0, c, c, coreR);
    cg.addColorStop(0, '#ffffff'); cg.addColorStop(0.45, hexA(accent, 0.95)); cg.addColorStop(1, hexA(accent, 0.12));
    ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(c, c, coreR, 0, TAU); ctx.fill();
    // reactor triangle
    ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = Math.max(1, r * 0.01);
    ctx.beginPath();
    for (let i = 0; i <= 3; i++) {
      const a = -Math.PI / 2 - rot * 0.6 + (i * TAU) / 3, rr = coreR * 0.62;
      if (i === 0) ctx.moveTo(c + Math.cos(a) * rr, c + Math.sin(a) * rr); else ctx.lineTo(c + Math.cos(a) * rr, c + Math.sin(a) * rr);
    }
    ctx.stroke();
  },
};
function hexA(hex, a) {
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map((x) => x + x).join('') : h, 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${Math.max(0, Math.min(1, a))})`;
}

// ------------------------------------------------------------------ full-screen pages
const Sheets = {
  open(title, build) {
    $('sheetTitle').textContent = title;
    const body = $('sheetBody');
    body.innerHTML = '';
    build(body);
    $('sheet').hidden = false;
    body.scrollTop = 0;
  },
  close() { $('sheet').hidden = true; },
  el(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; },

  help() {
    this.open(T('help'), (b) => {
      b.appendChild(this.el(`<div class="box"><p>${esc(T('help_intro'))}</p></div>`));
      for (const [sec, items] of HELP) {
        b.appendChild(this.el(`<div class="sec">${esc(sec)}</div>`));
        const list = this.el('<div class="list"></div>');
        for (const ex of items) {
          const btn = this.el(`<button class="ex" type="button">“${esc(ex)}”</button>`);
          btn.addEventListener('click', () => { Voice.unlock(); this.close(); Jarvis.handle(ex); });
          list.appendChild(btn);
        }
        b.appendChild(list);
      }
      b.appendChild(this.el(`<div class="box"><p class="muted">${esc(T('web_limits'))}</p></div>`));
    });
  },

  contacts() {
    this.open(T('contacts'), (b) => {
      b.appendChild(this.el(`<div class="box"><p class="muted">${esc(T('contacts_note'))}</p>
        <div class="field"><label for="cName">${esc(T('contact_name'))}</label><input id="cName" autocomplete="name"></div>
        <div class="field"><label for="cPhone">${esc(T('contact_number'))}</label><input id="cPhone" type="tel" inputmode="tel" autocomplete="tel"></div>
        <div class="field"><label for="cRel">${esc(T('relation'))}</label><input id="cRel"></div>
        <div class="row" style="display:flex;gap:.5rem;flex-wrap:wrap"><button class="btn" id="cAdd" type="button">${esc(T('add'))}</button>
        ${('contacts' in navigator && 'ContactsManager' in window) ? `<button class="btn ghost" id="cImport" type="button">${esc(T('import_contacts'))}</button>` : ''}</div></div>`));
      const list = this.el('<div class="list" id="cList"></div>');
      b.appendChild(list);
      const render = () => {
        list.innerHTML = '';
        if (!contacts.length) { list.appendChild(this.el(`<p class="muted">${esc(T('contacts_empty'))}</p>`)); return; }
        contacts.forEach((c, i) => {
          const it = this.el(`<div class="item"><div class="grow">${esc(c.name)}${c.rel ? ' · ' + esc(c.rel) : ''}<small>${esc(c.phone)}</small></div><button class="x" type="button" aria-label="${esc(T('delete'))}">×</button></div>`);
          it.querySelector('.x').addEventListener('click', () => { contacts.splice(i, 1); saveContacts(); render(); });
          list.appendChild(it);
        });
      };
      render();
      $('cAdd').addEventListener('click', () => {
        const name = $('cName').value.trim(), phone = $('cPhone').value.trim(), rel = $('cRel').value.trim();
        if (!name || !/\d{3,}/.test(phone)) { $(name ? 'cPhone' : 'cName').focus(); return; }
        contacts.push({ name, phone, rel }); saveContacts();
        $('cName').value = ''; $('cPhone').value = ''; $('cRel').value = '';
        render(); UI.toast(T('saved'));
      });
      const imp = $('cImport');
      if (imp) imp.addEventListener('click', async () => {
        try {
          const picked = await navigator.contacts.select(['name', 'tel'], { multiple: true });
          for (const p of picked || []) {
            const name = (p.name && p.name[0]) || '', phone = (p.tel && p.tel[0]) || '';
            if (name && phone && !contacts.some((c) => c.phone === phone)) contacts.push({ name, phone, rel: '' });
          }
          saveContacts(); render();
        } catch (e) { /* cancelled */ }
      });
    });
  },

  memory() {
    this.open(T('memory'), (b) => {
      b.appendChild(this.el(`<div class="box"><p class="muted">${esc(T('memory_note'))}</p>
        <div class="line"><input class="grow" id="mAdd" style="border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:.75rem .85rem;min-width:0" placeholder="${esc(T('memory_add'))}">
        <button class="btn" id="mAddBtn" type="button">${esc(T('add'))}</button></div></div>`));
      const list = this.el('<div class="list"></div>');
      b.appendChild(list);
      const render = () => {
        list.innerHTML = '';
        if (!facts.length) { list.appendChild(this.el(`<p class="muted">${esc(T('memory_empty'))}</p>`)); return; }
        facts.slice().reverse().forEach((f) => {
          const it = this.el(`<div class="item"><div class="grow">${esc(f)}</div><button class="x" type="button" aria-label="${esc(T('delete'))}">×</button></div>`);
          it.querySelector('.x').addEventListener('click', () => { facts = facts.filter((x) => x !== f); saveFacts(); render(); });
          list.appendChild(it);
        });
      };
      render();
      const add = () => { const v = $('mAdd').value.trim(); if (v) { addFacts([v]); $('mAdd').value = ''; render(); } };
      $('mAddBtn').addEventListener('click', add);
      $('mAdd').addEventListener('keydown', (e) => { if (e.key === 'Enter') add(); });
    });
  },

  reminders() {
    this.open(T('reminders'), (b) => {
      const notifOk = window.Notification && Notification.permission === 'granted';
      if (window.Notification) {
        const box = this.el(`<div class="box"><button class="btn ${notifOk ? 'ghost' : ''}" id="nBtn" type="button">${esc(notifOk ? T('notif_ok') : T('notif_btn'))}</button><p class="muted">${esc(T('reminder_open_note'))}</p></div>`);
        b.appendChild(box);
        $('nBtn').addEventListener('click', async () => {
          try { const p = await Notification.requestPermission(); if (p === 'granted') { $('nBtn').textContent = T('notif_ok'); $('nBtn').classList.add('ghost'); } } catch (e) { /* ignore */ }
        });
      }
      const list = this.el('<div class="list"></div>');
      b.appendChild(list);
      const render = () => {
        list.innerHTML = '';
        const up = reminders.filter((r) => !r.done).sort((x, y) => x.at - y.at);
        if (!up.length) { list.appendChild(this.el(`<p class="muted">${esc(T('reminders_empty'))}</p>`)); return; }
        for (const r of up) {
          const it = this.el(`<div class="item"><div class="grow">${esc(whenSpoken(new Date(r.at)))}<small>${esc(r.label || r.dur || '')}</small></div><button class="x" type="button" aria-label="${esc(T('delete'))}">×</button></div>`);
          it.querySelector('.x').addEventListener('click', () => { reminders = reminders.filter((x) => x.id !== r.id); saveReminders(); Remind.schedule(); render(); });
          list.appendChild(it);
        }
      };
      render();
    });
  },

  settings() {
    this.open(T('settings'), (b) => {
      const sec = (k) => b.appendChild(this.el(`<div class="sec">${esc(T(k))}</div>`));
      sec('s_you');
      b.appendChild(this.el(`<div class="box">
        <div class="field"><label for="pName">${esc(T('your_name'))}</label><input id="pName" value="${esc(P.name)}"></div>
        <div class="field"><label for="pAddr">${esc(T('address_custom'))}</label><input id="pAddr" value="${esc(P.address)}"></div></div>`));
      $('pName').addEventListener('change', (e) => { P.name = e.target.value.trim(); saveP(); });
      $('pAddr').addEventListener('change', (e) => { if (e.target.value.trim()) { P.address = e.target.value.trim(); saveP(); } });

      sec('s_voice');
      const vs = Voice.candidates();
      b.appendChild(this.el(`<div class="box">
        <div class="field"><label for="pVoice">${esc(T('voice'))}</label><select id="pVoice"><option value="">${esc(T('voice_auto'))}</option>
          ${vs.map((v) => `<option value="${esc(v.voiceURI)}"${v.voiceURI === P.voice ? ' selected' : ''}>${esc(v.name)} · ${esc(v.lang)}</option>`).join('')}</select></div>
        <div class="field"><label for="pRate">${esc(T('speed'))}: <span id="rateV">${P.rate.toFixed(2)}</span></label><input type="range" id="pRate" min="0.6" max="1.6" step="0.05" value="${P.rate}"></div>
        <div class="field"><label for="pPitch">${esc(T('pitch'))}: <span id="pitchV">${P.pitch.toFixed(2)}</span></label><input type="range" id="pPitch" min="0.6" max="1.4" step="0.05" value="${P.pitch}"></div>
        <button class="btn ghost" id="pTest" type="button">${esc(T('test_voice'))}</button></div>`));
      $('pVoice').addEventListener('change', (e) => { P.voice = e.target.value; saveP(); Voice.speak(T('voice_test')); });
      $('pRate').addEventListener('input', (e) => { P.rate = +e.target.value; $('rateV').textContent = P.rate.toFixed(2); saveP(); });
      $('pPitch').addEventListener('input', (e) => { P.pitch = +e.target.value; $('pitchV').textContent = P.pitch.toFixed(2); saveP(); });
      $('pTest').addEventListener('click', () => { Voice.unlock(); Voice.speak(T('voice_test')); });

      sec('s_brain');
      b.appendChild(this.el(`<div class="box">
        <div class="field"><label for="pKey">${esc(T('api_key'))}</label><input id="pKey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="AIza…" value="${esc(P.key)}"></div>
        <a class="btn ghost" href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">${esc(T('get_key'))}</a>
        <div class="field"><label for="pModel">${esc(T('model'))}</label><input id="pModel" autocapitalize="off" spellcheck="false" value="${esc(P.model)}"><small class="muted">${esc(T('model_help'))}</small></div>
        <div class="choice" id="models"></div>
        <div class="row" style="display:flex;gap:.5rem;flex-wrap:wrap"><button class="btn ghost" id="pFind" type="button">${esc(T('find_models'))}</button><button class="btn" id="pTestB" type="button">${esc(T('test_brain'))}</button></div>
        <p id="pBrainRes" class="muted"></p><p class="muted">${esc(T('key_note'))}</p></div>`));
      $('pKey').addEventListener('change', (e) => { P.key = e.target.value.trim(); saveP(); });
      $('pModel').addEventListener('change', (e) => { if (e.target.value.trim()) { P.model = e.target.value.trim(); saveP(); } });
      $('pFind').addEventListener('click', async () => {
        P.key = $('pKey').value.trim(); saveP();
        const box = $('models'); box.textContent = '…';
        const list = await Brain.listModels();
        box.innerHTML = '';
        if (!list.length) { box.textContent = T('models_none'); return; }
        for (const m of list.slice(0, 14)) {
          const btn = this.el(`<button type="button" class="${m === P.model ? 'on' : ''}">${esc(m)}</button>`);
          btn.addEventListener('click', () => { P.model = m; saveP(); $('pModel').value = m; box.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === btn)); });
          box.appendChild(btn);
        }
      });
      $('pTestB').addEventListener('click', async () => {
        P.key = $('pKey').value.trim(); if ($('pModel').value.trim()) P.model = $('pModel').value.trim(); saveP();
        $('pBrainRes').textContent = '…';
        const r = await Brain.ask(HI ? 'नमस्ते, बस एक शब्द में जवाब दीजिए।' : 'Hello! Reply with one word.');

        $('pModel').value = P.model;
      });

      sec('s_safety');
      b.appendChild(this.el(`<div class="box"><p class="muted">${esc(T('s5_text'))}</p>
        <div class="field"><label for="pEmN">${esc(T('contact_name'))}</label><input id="pEmN" value="${esc(P.emName)}"></div>
        <div class="field"><label for="pEmP">${esc(T('contact_number'))}</label><input id="pEmP" type="tel" inputmode="tel" value="${esc(P.emNumber)}"></div></div>`));
      $('pEmN').addEventListener('change', (e) => { P.emName = e.target.value.trim(); saveP(); });
      $('pEmP').addEventListener('change', (e) => { P.emNumber = e.target.value.trim(); saveP(); });

      sec('s_display');
      b.appendChild(this.el(`<div class="box"><div class="field"><label for="pScale">${esc(T('text_size'))}: <span id="scaleV">${Math.round(P.scale * 100)}%</span></label>
        <input type="range" id="pScale" min="0.85" max="1.6" step="0.05" value="${P.scale}"></div></div>`));
      $('pScale').addEventListener('input', (e) => { P.scale = +e.target.value; $('scaleV').textContent = Math.round(P.scale * 100) + '%'; applyScale(); saveP(); });

      sec('s_data');
      const nav = this.el('<div class="list"></div>');
      const link = (key, fn) => { const x = this.el(`<button class="ex" type="button">${esc(T(key))} ›</button>`); x.addEventListener('click', fn); nav.appendChild(x); };
      link('contacts', () => this.contacts());
      link('memory', () => this.memory());
      link('reminders', () => this.reminders());
      link('clear_chat', () => { history = []; saveHistory(); $('chat').querySelectorAll('.msg,.card').forEach((n) => n.remove()); $('empty').hidden = false; UI.toast(T('chat_cleared')); });
      link('rerun_setup', () => { this.close(); Setup.open(); });
      b.appendChild(nav);
      b.appendChild(this.el(`<p class="muted">${esc(T('data_note'))}</p>`));

      sec('s_about');
      b.appendChild(this.el(`<div class="box"><p>${esc(T('about'))}</p><p class="muted">${esc(T('web_limits'))}</p></div>`));
    });
  },
};

        add(`<h3 style="color:var(--accent);letter-spacing:${HI ? '0' : '.18em'};font-size:2.2rem">${esc(T('s1_title'))}</h3>`);
        add(`<p class="lead" style="font-size:1.08rem;color:var(--fg)">${esc(T('s1_text'))}</p>`);
        break;
      case 1: {
        add(`<h3>${esc(T('s2_title'))}</h3>`); add(`<p class="lead">${esc(T('s2_text'))}</p>`);
        add(`<div class="field"><label for="sName">${esc(T('your_name'))}</label><input id="sName" autocomplete="given-name" value="${esc(P.name)}"></div>`);
        add(`<p style="margin:.4rem 0 0;font-weight:600">${esc(T('address_q'))}</p>`);
        const ch = el('<div class="choice"></div>');
        const opts = TL('address_options');
        const refresh = () => {
          ch.innerHTML = '';
          const nm = $('sName').value.trim();
          const all = nm ? [...opts, T('name_address', { n: nm })] : opts;
          for (const o of all) {
            const btn = el(`<button type="button" class="${o === P.address ? 'on' : ''}">${esc(o)}</button>`);
            btn.addEventListener('click', () => { P.address = o; $('sAddr').value = o; refresh(); });
            ch.appendChild(btn);
          }
        };
        step.appendChild(ch);
        add(`<div class="field"><label for="sAddr">${esc(T('address_custom'))}</label><input id="sAddr" value="${esc(P.address)}"></div>`);
        refresh();
        $('sName').addEventListener('input', refresh);
        $('sAddr').addEventListener('input', (e) => { if (e.target.value.trim()) P.address = e.target.value.trim(); refresh(); });
        break;
      }
      case 2:
        add(`<h3>${esc(T('s3_title'))}</h3>`); add(`<p class="lead">${esc(T('s3_text'))}</p>`);
        add(`<a class="btn ghost" href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">${esc(T('get_key'))}</a>`);
        add(`<div class="field"><label for="sKey">${esc(T('api_key'))}</label><input id="sKey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="AIza…" value="${esc(P.key)}"></div>`);
        add(`<button class="btn" id="sTest" type="button">${esc(T('test_brain'))}</button>`);
        add('<p id="sRes" style="margin:0"></p>');
        add(`<p class="muted" style="margin:0">${esc(T('key_note'))}</p>`);
        $('sTest').addEventListener('click', async () => {
          P.key = $('sKey').value.trim(); saveP();
          $('sRes').textContent = '…'; $('sRes').style.color = 'var(--muted)';
          const r = await Brain.ask(HI ? 'नमस्ते, बस एक शब्द में जवाब दीजिए।' : 'Hello! Reply with one word.');
          $('sRes').textContent = r.error ? T('brain_fail', { e: r.error }) : T('brain_ok');
          $('sRes').style.color = r.error ? 'var(--danger)' : 'var(--ok)';
        });
        break;
      case 3:
        add(`<h3>${esc(T('s4_title'))}</h3>`); add(`<p class="lead">${esc(T('s4_text'))}</p>`);
        add(`<button class="btn" id="sMic" type="button">${esc(T('test_mic'))}</button>`);
        add('<p id="sMicRes" style="margin:0"></p>');
        add(`<button class="btn ghost" id="sVoice" type="button">${esc(T('test_voice'))}</button>`);
        if (!SR) add(`<p style="margin:0;color:var(--danger)">${esc(isIOS && !/Safari/.test(UA) ? T('no_sr_ios_app') : T('no_sr'))}</p>`);
        $('sVoice').addEventListener('click', () => { Voice.unlock(); Voice.speak(T('voice_test')); });
        $('sMic').addEventListener('click', async () => {
          Voice.unlock();
          const res = $('sMicRes');
          try {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
              const st = await navigator.mediaDevices.getUserMedia({ audio: true });
              st.getTracks().forEach((tr) => tr.stop());
            }
            res.textContent = T('mic_ok'); res.style.color = 'var(--ok)';
            if (SR) {
              const rec = new SR();
              rec.lang = SPEECH_LANG; rec.interimResults = true;
              res.textContent = T('say_something');
              rec.onresult = (e) => { const tx = Array.from(e.results).map((r) => r[0].transcript).join(' '); res.textContent = T('heard', { t: tx }); };
              rec.onerror = (e) => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { res.textContent = T('mic_bad') + ' · ' + T('mic_blocked'); res.style.color = 'var(--danger)'; } };
              try { rec.start(); } catch (e) { /* already running */ }
            }
          } catch (e) {
            res.textContent = T('mic_bad') + ' · ' + T('mic_blocked'); res.style.color = 'var(--danger)';
          }
        });
        break;
      case 4:
        add(`<h3>${esc(T('s5_title'))}</h3>`); add(`<p class="lead">${esc(T('s5_text'))}</p>`);
        add(`<div class="field"><label for="sEmN">${esc(T('contact_name'))}</label><input id="sEmN" value="${esc(P.emName)}"></div>`);
        add(`<div class="field"><label for="sEmP">${esc(T('contact_number'))}</label><input id="sEmP" type="tel" inputmode="tel" value="${esc(P.emNumber)}"></div>`);
        add(`<p class="muted" style="margin:0">${esc(T('contacts_note'))}</p>`);
        add(`<button class="btn ghost" id="sContacts" type="button">${esc(T('contacts'))}</button>`);
        $('sContacts').addEventListener('click', () => { this.save(); Sheets.contacts(); });
        break;
      case 5:
        add(`<h3>${esc(T('s6_title'))}</h3>`); add(`<p class="lead">${esc(T('s6_text'))}</p>`);
        add(`<div class="box"><p>${esc(isIOS ? T('install_ios') : T('install_android'))}</p><p class="muted">${esc(isIOS ? T('install_android') : T('install_ios'))}</p></div>`);
        for (const e of TL('examples')) add(`<div class="item"><div class="grow">“${esc(e)}”</div></div>`);
        break;
    }
    b.scrollTop = 0;
  },
  save() {
    if (this.step === 1) {
      P.name = ($('sName').value || '').trim();
      const ad = ($('sAddr').value || '').trim();
      if (ad) P.address = ad;
      if (P.name) addFacts([T('fact_name', { n: P.name })]);
    }
    if (this.step === 2) { const k = ($('sKey').value || '').trim(); if (k) P.key = k; }
    if (this.step === 4) { P.emName = ($('sEmN').value || '').trim(); P.emNumber = ($('sEmP').value || '').trim(); }
    saveP();
  },
  next() {
    Voice.unlock();
    this.save();
    if (this.step < this.count - 1) { this.step++; this.render(); return; }
    P.setupDone = true; saveP();
    this.close();
    Jarvis.say(Jarvis.greeting());
  },
  back() { this.save(); if (this.step > 0) { this.step--; this.render(); } },
};

// ------------------------------------------------------------------ start up
function applyScale() { document.documentElement.style.setProperty('--scale', String(P.scale)); }

function boot() {
  applyScale();
  $('empty').textContent = T('empty_chat');
  $('text').placeholder = T('type_hint');
  $('hfTitle').textContent = T('hf_title');
  $('hfSub').textContent = T('hf_sub');
  $('btnHelp').setAttribute('aria-label', T('help'));
  $('btnSettings').setAttribute('aria-label', T('settings'));
  $('mic').setAttribute('aria-label', T('tap_to_talk'));
  $('orb').setAttribute('aria-label', T('tap_to_talk'));

  const chips = [
    ['chip_time', () => Jarvis.handle(T('chip_time_cmd'))],
    ['chip_weather', () => Jarvis.handle(T('chip_weather_cmd'))],
    ['chip_news', () => Jarvis.handle(T('chip_news_cmd'))],
    ['chip_remind', () => Sheets.reminders()],
    ['chip_contacts', () => Sheets.contacts()],
    ['chip_sos', () => { Voice.unlock(); Jarvis.handle(HI ? 'इमरजेंसी' : 'emergency'); }, 'sos'],
  ];
  for (const [k, fn, cls] of chips) {
    const c = document.createElement('button');
    c.style.animationDelay = (350 + $('chips').children.length * 70) + 'ms';
    c.type = 'button'; c.className = 'chip' + (cls ? ' ' + cls : ''); c.textContent = T(k);
    c.addEventListener('click', () => { Voice.unlock(); fn(); });
    $('chips').appendChild(c);
  }

  $('orb').addEventListener('click', () => Jarvis.tap());
  $('orb').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); Jarvis.tap(); } });
  $('mic').addEventListener('click', () => {
    if ($('text').value.trim()) { $('form').requestSubmit ? $('form').requestSubmit() : submitText(); return; }
    Jarvis.tap();
  });
  $('form').addEventListener('submit', (e) => { e.preventDefault(); submitText(); });
  $('hf').addEventListener('change', (e) => Jarvis.setHandsFree(e.target.checked));
  $('btnHelp').addEventListener('click', () => Sheets.help());
  $('btnSettings').addEventListener('click', () => Sheets.settings());
  $('sheetClose').addEventListener('click', () => Sheets.close());
  $('setupNext').addEventListener('click', () => Setup.next());
  $('setupBack').addEventListener('click', () => Setup.back());
  document.addEventListener('pointerdown', () => Voice.unlock(), { once: true, capture: true });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('sheet').hidden) Sheets.close(); });
  document.addEventListener('visibilitychange', async () => {
    if (!document.hidden && Jarvis.handsFree) {
      try { if (navigator.wakeLock && !Jarvis.wakeLock) Jarvis.wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { /* ignore */ }
      if (!Ear.on) { Ear.want = true; Ear.restarts = []; Ear.resume(); }
    }
    if (!document.hidden) Remind.check();
  });

  if (!SR) UI.banner(isIOS && !/Safari/.test(UA) ? T('no_sr_ios_app') : T('no_sr'));
  else if (!window.isSecureContext) UI.banner(T('need_https'));

  UI.renderHistory();
  UI.status();
  Orb.init();
  Remind.check();

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    /* single-file edition */
  }

  if (!P.setupDone) Setup.open();
  else if (P.handsFree && SR) {
    // Browsers need one tap before listening again after a reload.
    P.handsFree = false; saveP();
    $('hf').checked = false;
  }
}
function submitText() {
  const v = $('text').value.trim();
  if (!v) return;
  Voice.unlock();
  $('text').value = '';
  $('text').blur();
  Jarvis.handle(v);
}

boot();

</script>

<script>
/* Stark Orbit add-on: big action button above the input bar, and open Android apps directly */
(function(){
 var isAndroid=/Android/i.test(navigator.userAgent);
 var PKG={'www.youtube.com':'com.google.android.youtube','m.youtube.com':'com.google.android.youtube','youtube.com':'com.google.android.youtube','music.youtube.com':'com.google.android.apps.youtube.music',
  'www.instagram.com':'com.instagram.android','instagram.com':'com.instagram.android','www.facebook.com':'com.facebook.katana','m.facebook.com':'com.facebook.katana',
  'mail.google.com':'com.google.android.gm','maps.google.com':'com.google.android.apps.maps','www.google.com/maps':'com.google.android.apps.maps',
  'open.spotify.com':'com.spotify.music','x.com':'com.twitter.android','twitter.com':'com.twitter.android','www.linkedin.com':'com.linkedin.android','wa.me':'com.whatsapp','api.whatsapp.com':'com.whatsapp'};
 function appIntent(href){try{var u=new URL(href);if(!/^https?:$/.test(u.protocol))return null;var p=PKG[u.host]||(u.host==='www.google.com'&&u.pathname.indexOf('/maps')===0?PKG['www.google.com/maps']:null);if(!p)return null;
   return 'intent://'+u.host+u.pathname+u.search+'#Intent;scheme=https;package='+p+';S.browser_fallback_url='+encodeURIComponent(href)+';end'}catch(e){return null}}
 function go(href){if(isAndroid){var i=appIntent(href);if(i){location.href=i;return true}}return false}
 document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href]');if(!a)return;if(go(a.getAttribute('href'))){e.preventDefault();e.stopPropagation()}},true);
 var dock=document.createElement('div');dock.id='siDock';dock.setAttribute('role','region');dock.setAttribute('aria-label','Action');document.body.appendChild(dock);
 var timer=null;function hide(){dock.classList.remove('on');clearTimeout(timer)}
 function show(card){var btns=card.querySelectorAll('.row .btn');if(!btns.length)return;dock.innerHTML='';
  var t=document.createElement('div');t.className='t';t.textContent=(card.querySelector('.ttl')||{}).textContent||'';if(t.textContent)dock.appendChild(t);
  Array.prototype.slice.call(btns,0,2).forEach(function(b){var el;
   if(b.tagName==='A'){el=document.createElement('a');el.href=b.getAttribute('href');if(b.target)el.target=b.target;if(b.rel)el.rel=b.rel;if(b.hasAttribute('download'))el.setAttribute('download',b.getAttribute('download'))}
   else{el=document.createElement('button');el.type='button';el.addEventListener('click',function(){b.click()})}
   el.className=(b.classList.contains('ok')?'ok':b.classList.contains('danger')?'danger':'');
   var h=el.getAttribute&&el.getAttribute('href')||'';el.textContent=(/^tel:/.test(h)?'📞 ':'')+b.textContent;
   el.addEventListener('click',function(){setTimeout(hide,400)});dock.appendChild(el)});
  var x=document.createElement('button');x.type='button';x.className='x';x.setAttribute('aria-label','Close');x.textContent='✕';x.addEventListener('click',hide);dock.appendChild(x);
  dock.classList.add('on');clearTimeout(timer);timer=setTimeout(hide,30000)}
 var chat=document.getElementById('chat')||document.querySelector('.chat');
 var mo=new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(function(n){if(n.nodeType===1&&n.classList&&n.classList.contains('card'))show(n)})})});
 function attach(){var c=document.getElementById('chat')||document.querySelector('.chat');if(c){mo.observe(c,{childList:true,subtree:true});return true}return false}
 if(!attach())document.addEventListener('DOMContentLoaded',attach,{once:true});
 var f=document.getElementById('form');if(f)f.addEventListener('submit',function(){hide()},true);
})();
</script>
